# NOTE:
# One scrape job per process kind, in pipeline order.
#
# The workers are found by DNS because Compose gives every replica of a service the same name, which is how
# the worker-scaling experiment adds replicas without touching this file.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: intake
    static_configs:
      - targets:
          - intake:8010

  - job_name: enrichment
    static_configs:
      - targets:
          - enrichment:8100

  - job_name: analysis-worker
    dns_sd_configs:
      - names:
          - analysis-worker
        type: A
        port: 9464
        refresh_interval: 10s

  - job_name: aggregation-worker
    dns_sd_configs:
      - names:
          - aggregation-worker
        type: A
        port: 9464
        refresh_interval: 10s
