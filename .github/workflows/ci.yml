# NOTE:
# Two jobs, in the order the Makefile runs them: the gate every push to the default branch and every pull request must
# pass, and the integration lane against real containers, which runs on the default branch and on request.
#
# Every action is pinned to a full commit, with the release it names beside it, because a tag can be moved and a
# commit cannot; the runner's operating system release, uv, and gitleaks are pinned for the same reason.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# NOTE:
# The jobs only read the repository, so the token they receive can do nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # NOTE:
      # The whole history rather than the last commit, because the secret scan reads every commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      # NOTE:
      # The release archive the Makefile's `GITLEAKS_VERSION` names, checked against its line in `SHA256SUMS` before
      # it is unpacked: a version with no line there gives the check nothing to read, and the step fails.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          awk -v name="$archive" '$2 == name' "$GITHUB_WORKSPACE/SHA256SUMS" | sha256sum --check --strict
          mkdir -p bin
          tar -xzf "$archive" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create the environment
        run: make setup

      - name: Cache the NLTK data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nltk_data
          key: nltk-data-${{ hashFiles('wordwinnow/infrastructure/linguistics/nltk_resources.py') }}

      - name: Install the NLTK data
        run: make nltk-data

      - name: Run the gate
        run: make verify

  integration:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Create the environment
        run: make setup

      - name: Start the backing services
        run: make up

      - name: Run the integration lane
        run: make test-integration

      - name: Stop the backing services
        if: always()
        run: make down
