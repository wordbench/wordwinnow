# NOTE:
# Alembic's own configuration, for a developer's `alembic` command: where the migration scripts live and how a new one
# is named.
#
# The package applies its migrations without this file, from the same directory, so a wheel does not carry it.
#
# The database URL is deliberately absent; `env.py` in the scripts' directory resolves it from
# `WORDWINNOW_DATABASE_URL` or from the project settings, and a programmatic caller sets `sqlalchemy.url` on the
# configuration object instead.
#
# `%(here)s` is the directory of this file, so the paths hold from any working directory.
[alembic]
script_location = %(here)s/wordwinnow/infrastructure/persistence/migration_scripts
prepend_sys_path = %(here)s

path_separator = os
file_template = %%(rev)s_%%(slug)s
