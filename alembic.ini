# NOTE:
# Alembic's own configuration: where the migration scripts live and how a new one is named.
#
# The database URL is deliberately absent; `alembic/env.py` resolves it from `WORDWINNOW_DATABASE_URL` or from the
# project settings, and a programmatic caller sets `sqlalchemy.url` on the configuration object instead.
#
# `%(here)s` is the directory of this file, so the paths hold from any working directory.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

path_separator = os
file_template = %%(rev)s_%%(slug)s
